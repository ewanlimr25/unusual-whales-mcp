[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unusual-whales-mcp"
version = "0.1.0"
description = "MCP server for analyzing Unusual Whales data exports"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
unusual-whales-mcp = "src.server:main"
